<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESPDenon232 Control Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .status-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .status-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .status-item .label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .status-item .value {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .status-item.active {
            border-left-color: #4CAF50;
            background: #f0f7f0;
        }

        .status-item.inactive {
            border-left-color: #ff9800;
            background: #fff8f0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 18px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
            font-size: 14px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .button.primary {
            background: #667eea;
            color: white;
        }

        .button.primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .button.primary:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: #f0f0f0;
            color: #333;
        }

        .button.secondary:hover {
            background: #e0e0e0;
        }

        .button.small {
            padding: 8px 12px;
            font-size: 12px;
        }

        .slider-container {
            margin-bottom: 20px;
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .slider::-webkit-slider-thumb:hover {
            background: #5568d3;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .slider::-moz-range-thumb:hover {
            background: #5568d3;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }

        .slider-value {
            display: inline-block;
            min-width: 45px;
            text-align: right;
            font-weight: bold;
            color: #667eea;
            margin-left: 10px;
        }

        .select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .select:hover {
            border-color: #667eea;
        }

        .select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 20px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 14px;
            font-weight: 600;
            color: #999;
            position: relative;
            transition: color 0.3s ease;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab.active {
            color: #667eea;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .command-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }

        .command-btn {
            padding: 12px;
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
            color: #333;
        }

        .command-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .debug-console {
            background: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            height: 400px;
            overflow-y: auto;
            margin-top: 20px;
            border: 1px solid #333;
        }

        .debug-line {
            margin-bottom: 5px;
            word-break: break-all;
        }

        .debug-line.error {
            color: #ff6b6b;
        }

        .debug-line.warning {
            color: #ffd93d;
        }

        .debug-line.info {
            color: #00ff00;
        }

        .debug-line.command {
            color: #00d4ff;
        }

        .toggle {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
            background: #ccc;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .toggle-switch.on {
            background: #4CAF50;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s ease;
        }

        .toggle-switch.on::after {
            left: 24px;
        }

        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #f5c6cb;
        }

        .alert.info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #bee5eb;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #667eea;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .full-width {
            grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 20px;
            }

            .card {
                padding: 15px;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            .status-bar {
                grid-template-columns: 1fr;
            }

            .command-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }

        .connection-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            background: #999;
        }

        .connection-indicator.connected {
            background: #4CAF50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .time-badge {
            display: inline-block;
            background: #f0f0f0;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            color: #999;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 ESPDenon232 Control Panel</h1>
            <p>Real-time Denon Receiver Control via RS232</p>
            <div class="status-bar">
                <div class="status-item" id="powerStatus">
                    <div class="label">Power</div>
                    <div class="value">
                        <span class="connection-indicator"></span>
                        <span>Offline</span>
                    </div>
                </div>
                <div class="status-item" id="volumeStatus">
                    <div class="label">Volume</div>
                    <div class="value">-- %</div>
                </div>
                <div class="status-item" id="muteStatus">
                    <div class="label">Mute</div>
                    <div class="value">Off</div>
                </div>
                <div class="status-item" id="sourceStatus">
                    <div class="label">Input</div>
                    <div class="value">--</div>
                </div>
            </div>
        </div>

        <div class="alert" id="alertBox"></div>

        <div class="grid">
            <!-- Power Control -->
            <div class="card">
                <h2>⚡ Power Control</h2>
                <div class="button-group">
                    <button class="button primary" onclick="sendCommand('power_on')">Power On</button>
                    <button class="button secondary" onclick="sendCommand('power_off')">Power Off</button>
                </div>
                <div class="control-group">
                    <button class="button small secondary" onclick="queryState('power_query')" style="width: 100%;">
                        📊 Query Status
                    </button>
                </div>
            </div>

            <!-- Volume Control -->
            <div class="card">
                <h2>🔊 Volume Control</h2>
                <div class="slider-container">
                    <label class="label">
                        Volume Level
                        <span class="slider-value" id="volumeValue">50%</span>
                    </label>
                    <input type="range" min="0" max="100" value="50" class="slider" id="volumeSlider" 
                           oninput="updateVolume(this.value)">
                </div>
                <div class="button-group">
                    <button class="button primary" onclick="sendCommand('volume_up')">Volume +</button>
                    <button class="button primary" onclick="sendCommand('volume_down')">Volume -</button>
                </div>
            </div>

            <!-- Mute Control -->
            <div class="card">
                <h2>🔇 Mute Control</h2>
                <div class="button-group">
                    <button class="button primary" onclick="sendCommand('mute_on')">Mute On</button>
                    <button class="button primary" onclick="sendCommand('mute_off')">Mute Off</button>
                </div>
                <div class="control-group">
                    <button class="button small secondary" onclick="queryState('mute_query')" style="width: 100%;">
                        📊 Query Status
                    </button>
                </div>
            </div>

            <!-- Source Selection -->
            <div class="card">
                <h2>📺 Source Selection</h2>
                <div class="control-group">
                    <label class="label">Select Input</label>
                    <select class="select" id="sourceSelect" onchange="selectSource(this.value)">
                        <option value="">-- Choose Source --</option>
                        <option value="source_cd">CD</option>
                        <option value="source_dvd">DVD</option>
                        <option value="source_tv">TV/Cable</option>
                        <option value="source_hdp">HDP</option>
                        <option value="source_aux">Aux</option>
                        <option value="source_net">Network</option>
                        <option value="source_usb">USB</option>
                    </select>
                </div>
                <div class="control-group">
                    <button class="button small secondary" onclick="queryState('source_query')" style="width: 100%;">
                        📊 Current Source
                    </button>
                </div>
            </div>

            <!-- Sound Mode -->
            <div class="card">
                <h2>🎵 Sound Mode</h2>
                <div class="control-group">
                    <label class="label">Select Mode</label>
                    <select class="select" onchange="sendCommand(this.value); this.value='';">
                        <option value="">-- Choose Mode --</option>
                        <option value="sound_stereo">Stereo</option>
                        <option value="sound_dolby_digital">Dolby Digital</option>
                        <option value="sound_dts">DTS</option>
                        <option value="sound_surround">Surround</option>
                    </select>
                </div>
            </div>

            <!-- Video Settings -->
            <div class="card">
                <h2>📡 Video Output</h2>
                <div class="command-grid">
                    <button class="command-btn" onclick="sendCommand('hdmi_out_1')">HDMI 1</button>
                    <button class="command-btn" onclick="sendCommand('hdmi_out_2')">HDMI 2</button>
                    <button class="command-btn" onclick="sendCommand('hdmi_out_both')">Both</button>
                </div>
            </div>

            <!-- Dynamic Range -->
            <div class="card">
                <h2>📊 Dynamic Range</h2>
                <div class="command-grid">
                    <button class="command-btn" onclick="sendCommand('dynamic_range_off')">Off</button>
                    <button class="command-btn" onclick="sendCommand('dynamic_range_lite')">Lite</button>
                    <button class="command-btn" onclick="sendCommand('dynamic_range_mid')">Mid</button>
                    <button class="command-btn" onclick="sendCommand('dynamic_range_max')">Max</button>
                </div>
            </div>

            <!-- Display Control -->
            <div class="card">
                <h2>💡 Display & Power</h2>
                <div class="button-group">
                    <button class="button small primary" onclick="sendCommand('display_on')">Display On</button>
                    <button class="button small primary" onclick="sendCommand('display_off')">Display Off</button>
                </div>
                <div class="button-group">
                    <button class="button small primary" onclick="sendCommand('eco_on')">Eco On</button>
                    <button class="button small primary" onclick="sendCommand('eco_off')">Eco Off</button>
                </div>
            </div>

            <!-- Commands Reference -->
            <div class="card full-width">
                <h2>📚 Advanced Commands</h2>
                <div class="tabs">
                    <button class="tab active" onclick="switchTab(event, 'power-cmds')">Power</button>
                    <button class="tab" onclick="switchTab(event, 'video-cmds')">Video</button>
                    <button class="tab" onclick="switchTab(event, 'tuner-cmds')">Tuner</button>
                    <button class="tab" onclick="switchTab(event, 'misc-cmds')">Misc</button>
                </div>

                <div id="power-cmds" class="tab-content active">
                    <div class="command-grid">
                        <button class="command-btn" onclick="sendCommand('power_on')">Power On</button>
                        <button class="command-btn" onclick="sendCommand('power_off')">Power Off</button>
                        <button class="command-btn" onclick="queryState('power_query')">Query</button>
                    </div>
                </div>

                <div id="video-cmds" class="tab-content">
                    <div class="command-grid">
                        <button class="command-btn" onclick="sendCommand('video_auto')">Auto</button>
                        <button class="command-btn" onclick="sendCommand('video_hdmi')">HDMI</button>
                        <button class="command-btn" onclick="sendCommand('video_component')">Component</button>
                        <button class="command-btn" onclick="sendCommand('video_composite')">Composite</button>
                    </div>
                </div>

                <div id="tuner-cmds" class="tab-content">
                    <div class="command-grid">
                        <button class="command-btn" onclick="sendCommand('tuner_up')">Up</button>
                        <button class="command-btn" onclick="sendCommand('tuner_down')">Down</button>
                        <button class="command-btn" onclick="queryState('tuner_query')">Query</button>
                    </div>
                </div>

                <div id="misc-cmds" class="tab-content">
                    <div class="command-grid">
                        <button class="command-btn" onclick="sendCommand('display_on')">Display On</button>
                        <button class="command-btn" onclick="sendCommand('display_off')">Display Off</button>
                        <button class="command-btn" onclick="sendCommand('eco_on')">Eco On</button>
                        <button class="command-btn" onclick="sendCommand('eco_off')">Eco Off</button>
                    </div>
                </div>
            </div>

            <!-- Debug Console -->
            <div class="card full-width">
                <h2>🐛 Debug Console</h2>
                <div style="margin-bottom: 15px;">
                    <button class="button small secondary" onclick="clearDebugConsole()">Clear</button>
                    <button class="button small secondary" onclick="downloadDebugLog()">Download Log</button>
                    <label class="toggle">
                        <span>Auto-scroll:</span>
                        <div class="toggle-switch on" id="autoScrollToggle" onclick="toggleAutoScroll()"></div>
                    </label>
                </div>
                <div class="debug-console" id="debugConsole"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = `http://${window.location.hostname}:80/api`;
        let autoScroll = true;
        let debugLog = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            addDebugLog('info', 'ESPDenon232 Control Panel loaded');
            updateAllStatus();
            setInterval(updateAllStatus, 5000);
            
            // WebSocket for live updates
            connectWebSocket();
        });

        function connectWebSocket() {
            // Try to connect to WebSocket for live updates
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocol}//${window.location.hostname}:81/`);
            
            ws.onopen = () => {
                addDebugLog('info', '✓ WebSocket connected for live updates');
            };
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    updateStatusFromWebSocket(data);
                    addDebugLog('command', `← Received: ${JSON.stringify(data)}`);
                } catch (e) {
                    addDebugLog('error', `WebSocket parse error: ${e.message}`);
                }
            };
            
            ws.onerror = (error) => {
                addDebugLog('warning', 'WebSocket error - falling back to polling');
            };
            
            ws.onclose = () => {
                addDebugLog('warning', 'WebSocket disconnected - retrying in 5s');
                setTimeout(connectWebSocket, 5000);
            };
        }

        function addDebugLog(type, message) {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}`;
            debugLog.push({ type, message: logEntry });
            
            const console = document.getElementById('debugConsole');
            const line = document.createElement('div');
            line.className = `debug-line ${type}`;
            line.textContent = logEntry;
            console.appendChild(line);
            
            if (autoScroll) {
                console.scrollTop = console.scrollHeight;
            }
            
            // Limit log to 500 entries
            if (debugLog.length > 500) {
                debugLog.shift();
                console.removeChild(console.firstChild);
            }
        }

        function clearDebugConsole() {
            document.getElementById('debugConsole').innerHTML = '';
            debugLog = [];
            addDebugLog('info', 'Debug console cleared');
        }

        function downloadDebugLog() {
            const content = debugLog.map(entry => entry.message).join('\n');
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `denon232_debug_${new Date().toISOString()}.log`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function toggleAutoScroll() {
            autoScroll = !autoScroll;
            document.getElementById('autoScrollToggle').classList.toggle('on');
        }

        async function sendCommand(command) {
            try {
                addDebugLog('command', `→ Sending: ${command}`);
                const response = await fetch(`${API_BASE}/command/${command}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (response.ok) {
                    showAlert('Command sent successfully', 'success');
                    addDebugLog('info', `✓ ${command} executed`);
                } else {
                    showAlert(`Error: ${response.statusText}`, 'error');
                    addDebugLog('error', `✗ ${command} failed: ${response.statusText}`);
                }
            } catch (error) {
                showAlert(`Connection error: ${error.message}`, 'error');
                addDebugLog('error', `Connection error: ${error.message}`);
            }
        }

        async function queryState(query) {
            try {
                addDebugLog('command', `→ Query: ${query}`);
                const response = await fetch(`${API_BASE}/query/${query}`);
                const data = await response.json();
                
                if (response.ok) {
                    addDebugLog('info', `← Response: ${JSON.stringify(data)}`);
                    updateStatusFromResponse(data);
                } else {
                    addDebugLog('error', `Query failed: ${response.statusText}`);
                }
            } catch (error) {
                addDebugLog('error', `Query error: ${error.message}`);
            }
        }

        function updateVolume(value) {
            document.getElementById('volumeValue').textContent = value + '%';
            const actualValue = Math.round((value / 100) * 98); // Denon uses 0-98
            sendCommand(`volume_set_${actualValue}`);
        }

        function selectSource(command) {
            if (command) {
                sendCommand(command);
            }
        }

        async function updateAllStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`);
                const data = await response.json();
                
                if (response.ok) {
                    updateStatusDisplay(data);
                }
            } catch (error) {
                updateConnectionStatus(false);
                addDebugLog('error', `Status update failed: ${error.message}`);
            }
        }

        function updateStatusDisplay(data) {
            const powerStatus = document.getElementById('powerStatus');
            const volumeStatus = document.getElementById('volumeStatus');
            const muteStatus = document.getElementById('muteStatus');
            const sourceStatus = document.getElementById('sourceStatus');
            
            if (data.power === 'on') {
                powerStatus.classList.add('active');
                powerStatus.classList.remove('inactive');
                powerStatus.querySelector('.value').innerHTML = 
                    '<span class="connection-indicator connected"></span><span>On</span>';
            } else {
                powerStatus.classList.remove('active');
                powerStatus.classList.add('inactive');
                powerStatus.querySelector('.value').innerHTML = 
                    '<span class="connection-indicator"></span><span>Standby</span>';
            }
            
            if (data.volume !== undefined) {
                volumeStatus.querySelector('.value').textContent = data.volume + '%';
                document.getElementById('volumeSlider').value = data.volume;
                document.getElementById('volumeValue').textContent = data.volume + '%';
            }
            
            if (data.muted !== undefined) {
                muteStatus.querySelector('.value').textContent = data.muted ? 'On' : 'Off';
            }
            
            if (data.source) {
                sourceStatus.querySelector('.value').textContent = data.source;
            }
            
            updateConnectionStatus(true);
        }

        function updateStatusFromWebSocket(data) {
            updateStatusDisplay(data);
        }

        function updateStatusFromResponse(data) {
            updateStatusDisplay(data);
        }

        function updateConnectionStatus(connected) {
            const indicator = document.querySelector('.connection-indicator');
            if (connected) {
                indicator.classList.add('connected');
            } else {
                indicator.classList.remove('connected');
            }
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert show ${type}`;
            
            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 4000);
        }

        function switchTab(event, tabName) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('active');
            });
            
            // Remove active class from all tabs
            document.querySelectorAll('.tab').forEach(el => {
                el.classList.remove('active');
            });
            
            // Show selected tab content and mark tab as active
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // Real-time status update simulation
        function updateStatusFromResponse(data) {
            if (data.power) {
                document.querySelectorAll('[data-power]').forEach(el => {
                    el.textContent = data.power === 'PWON' ? 'On' : 'Standby';
                });
            }
            if (data.volume) {
                document.getElementById('volumeSlider').value = data.volume;
                document.getElementById('volumeValue').textContent = data.volume + '%';
            }
            if (data.muted !== undefined) {
                document.getElementById('muteStatus').querySelector('.value').textContent = 
                    data.muted ? 'On' : 'Off';
            }
            if (data.source) {
                document.getElementById('sourceSelect').value = '';
                document.getElementById('sourceStatus').querySelector('.value').textContent = data.source;
            }
        }
    </script>
</body>
</html>
